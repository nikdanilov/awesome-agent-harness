name: Submit an Agent Harness
description: Suggest a runnable AI agent harness or multiplexer.
title: "[Add]: "
labels: ["submission"]
body:
  - type: input
    id: name
    attributes:
      label: Harness Name
      placeholder: e.g., OpenCode
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Canonical URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Personal & Always-On Harnesses
        - Coding Harnesses
        - Agent Multiplexers & Control Planes
        - Autonomous SWE Harnesses
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: One-Line Description
      description: Concise, neutral summary of what makes this harness distinct.
      placeholder: Open-source terminal coding harness supporting 75+ providers and LSP integration.
    validations:
      required: true
