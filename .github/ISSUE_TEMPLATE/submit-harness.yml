name: Submit an Agent Harness
description: Suggest a runnable AI agent harness, meta-harness, or harness SDK.
title: "[Add]: "
labels: ["submission"]
body:
  - type: input
    id: name
    attributes:
      label: Harness Name
      placeholder: e.g., OpenCode
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Canonical URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - CLI & Terminal Harnesses
        - IDE & Editor Harnesses
        - Autonomous & Sandbox-First Harnesses
        - Meta-Harnesses
        - Personal & Browser Harnesses
        - Harness SDKs
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: One-Line Description
      description: Concise, neutral summary of what makes this harness architecturally distinct.
      placeholder: Open-source terminal coding harness supporting 75+ providers and LSP integration.
    validations:
      required: true
